<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FA0272" />
      <stop offset="100%" stop-color="#C90260" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="200" height="200" rx="44" fill="url(#bg)" />

  <!-- Sunrise: arc + rays, evoking "6AM" -->
  <g stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="100" y1="52" x2="100" y2="63" />
    <line x1="68" y1="63" x2="76" y2="72" />
    <line x1="132" y1="63" x2="124" y2="72" />
    <path d="M 70 104 A 32 32 0 0 1 130 104" />
  </g>
  <line x1="58" y1="104" x2="142" y2="104" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />

  <!-- Wordmark, kept tight to center so it survives external zoom/crop -->
  <text x="100" y="135" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="26" fill="#FFFFFF" letter-spacing="1">6AM</text>
  <text x="100" y="153" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="15" fill="#FFE3EE" letter-spacing="4">FRESH</text>
</svg>
